name: helpdesk_app
description: E-Ticketing Helpdesk Mobile App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  riverpod: ^2.4.0
  flutter_riverpod: ^2.4.0
  intl: ^0.19.0
  shimmer: ^3.0.0
  flutter_animate: ^4.5.0
  cached_network_image: ^3.3.1
  google_fonts: ^6.2.1
  supabase_flutter: ^2.12.4
  flutter_dotenv: ^6.0.1
  image_picker: ^1.1.2
  flutter_launcher_icons: ^0.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - .env

flutter_icons:
  android: true
  ios: true
  image_path_ios: "assets/images/logo.png"
  image_path_android: "assets/images/logo.png"
  remove_alpha_ios: true
